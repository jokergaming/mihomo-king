name: Nix

on:
  push:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - flake.nix
      - flake.lock
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - flake.nix
      - flake.lock
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and install (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check flake
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Run default package
        run: nix run --no-update-lock-file --print-build-logs . -- --version
      - name: Install named package and check completions
        run: |
          profile="$RUNNER_TEMP/mihomo-king-profile"
          nix profile add --no-update-lock-file --profile "$profile" .#mihomo-king
          "$profile/bin/mihomo-king" --version
          test -s "$profile/share/bash-completion/completions/mihomo-king"
          test -s "$profile/share/zsh/site-functions/_mihomo-king"
      - name: Evaluate NixOS system package configuration
        run: |
          nix eval --impure --raw --expr '
            let
              flake = builtins.getFlake (toString ./.);
              system = builtins.currentSystem;
              package = flake.packages.${system}.default;
              nixos = flake.inputs.nixpkgs.lib.nixosSystem {
                modules = [ {
                  nixpkgs.hostPlatform = system;
                  environment.systemPackages = [ package ];
                  system.stateVersion = "26.05";
                } ];
              };
            in
              assert builtins.elem package nixos.config.environment.systemPackages;
              package.outPath
          '
