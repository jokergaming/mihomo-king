name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }} ${{ matrix.goarch }} ${{ matrix.libc }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            libc: glibc
            runner: ubuntu-24.04
          - goos: linux
            goarch: amd64
            libc: musl
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            libc: glibc
            runner: ubuntu-24.04-arm
          - goos: linux
            goarch: arm64
            libc: musl
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            libc: none
            runner: ubuntu-24.04
          - goos: darwin
            goarch: arm64
            libc: none
            runner: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          LIBC: ${{ matrix.libc }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          suffix=""
          ldflags="-s -w -X mihomo-king/internal/cli.Version=${VERSION}"
          if [[ "${GOOS}" == linux ]]; then
            suffix="-${LIBC}"
            if [[ "${LIBC}" == glibc ]]; then
              export CGO_ENABLED=1
              ldflags="${ldflags} -linkmode external"
            else
              export CGO_ENABLED=0
            fi
          else
            export CGO_ENABLED=0
          fi
          binary="mihomo-king-${GOOS}-${GOARCH}${suffix}"
          go build -trimpath -ldflags="${ldflags}" -o "dist/${binary}" .
          tar -C dist -czf "dist/${binary}.tar.gz" "${binary}"
          (cd dist && sha256sum "${binary}.tar.gz" > "${binary}.tar.gz.sha256")

      - name: Verify Linux linkage
        if: matrix.goos == 'linux'
        env:
          GOARCH: ${{ matrix.goarch }}
          LIBC: ${{ matrix.libc }}
        run: |
          binary="dist/mihomo-king-linux-${GOARCH}-${LIBC}"
          headers="$(readelf -l "${binary}")"
          dynamic="$(readelf -d "${binary}")"
          if [[ "${LIBC}" == glibc ]]; then
            [[ "${headers}" == *INTERP* && "${dynamic}" == *libc.so.6* ]] || {
              echo "${binary} is not dynamically linked with glibc" >&2
              exit 1
            }
          else
            [[ "${headers}" != *INTERP* && "${dynamic}" != *NEEDED* ]] || {
              echo "${binary} depends on a dynamic loader or shared library" >&2
              exit 1
            }
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-king-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.libc }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: |
          cd dist
          for checksum in *.sha256; do
            sha256sum -c "${checksum}"
          done

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_TAG}"
          fi

          case "${tag}" in
            v*) ;;
            *) echo "Release tag must start with v, got: ${tag}" >&2; exit 1 ;;
          esac

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
