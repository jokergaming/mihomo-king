name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to rebuild; leave blank for nightly"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && !inputs.tag }}

jobs:
  prepare:
    name: resolve release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
          else
            tag=nightly
          fi

          if [[ "${INPUT_TAG}" == nightly ]]; then
            echo "Leave the tag input blank for nightly" >&2
            exit 1
          fi
          if [[ "${tag}" == nightly ]]; then
            if [[ "${GITHUB_REF}" != refs/heads/main ]]; then
              echo "Nightly builds must run from main" >&2
              exit 1
            fi
          elif [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid version tag: ${tag}" >&2
            exit 1
          fi

          sha="$(git rev-parse HEAD)"
          version="${tag}"
          if [[ "${tag}" == nightly ]]; then
            version="nightly-${sha:0:7}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: build ${{ matrix.goos }} ${{ matrix.goarch }} ${{ matrix.libc }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            libc: glibc
            runner: ubuntu-24.04
          - goos: linux
            goarch: amd64
            libc: musl
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            libc: glibc
            runner: ubuntu-24.04-arm
          - goos: linux
            goarch: arm64
            libc: musl
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            libc: none
            runner: ubuntu-24.04
          - goos: darwin
            goarch: arm64
            libc: none
            runner: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          LIBC: ${{ matrix.libc }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          suffix=""
          ldflags="-s -w -X mihomo-king/internal/cli.Version=${VERSION}"
          if [[ "${GOOS}" == linux ]]; then
            suffix="-${LIBC}"
            if [[ "${LIBC}" == glibc ]]; then
              export CGO_ENABLED=1
              ldflags="${ldflags} -linkmode external"
            else
              export CGO_ENABLED=0
            fi
          else
            export CGO_ENABLED=0
          fi
          binary="mihomo-king-${GOOS}-${GOARCH}${suffix}"
          go build -trimpath -ldflags="${ldflags}" -o "dist/${binary}" .
          tar -C dist -czf "dist/${binary}.tar.gz" "${binary}"
          (cd dist && sha256sum "${binary}.tar.gz" > "${binary}.tar.gz.sha256")

      - name: Verify Linux linkage
        if: matrix.goos == 'linux'
        env:
          GOARCH: ${{ matrix.goarch }}
          LIBC: ${{ matrix.libc }}
        run: |
          binary="dist/mihomo-king-linux-${GOARCH}-${LIBC}"
          headers="$(readelf -l "${binary}")"
          dynamic="$(readelf -d "${binary}")"
          if [[ "${LIBC}" == glibc ]]; then
            [[ "${headers}" == *INTERP* && "${dynamic}" == *libc.so.6* ]] || {
              echo "${binary} is not dynamically linked with glibc" >&2
              exit 1
            }
          else
            [[ "${headers}" != *INTERP* && "${dynamic}" != *NEEDED* ]] || {
              echo "${binary} depends on a dynamic loader or shared library" >&2
              exit 1
            }
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-king-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.libc }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: |
          cd dist
          for checksum in *.sha256; do
            sha256sum -c "${checksum}"
          done

      - name: Move nightly tag
        if: needs.prepare.outputs.tag == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" --silent 2>/dev/null; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="${TARGET_SHA}" -F force=true --silent
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/tags/nightly -f sha="${TARGET_SHA}" --silent
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          prerelease: ${{ needs.prepare.outputs.tag == 'nightly' }}
          make_latest: ${{ needs.prepare.outputs.tag == 'nightly' && 'false' || 'legacy' }}
          body: ${{ needs.prepare.outputs.tag == 'nightly' && format('Rolling build from main at commit {0}.', needs.prepare.outputs.sha) || '' }}
          generate_release_notes: ${{ needs.prepare.outputs.tag != 'nightly' }}
          overwrite_files: true
